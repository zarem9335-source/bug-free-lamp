name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Unzip project
        run: |
          ls -la
          ZIP="ekts-android.zip"
          if [ ! -f "$ZIP" ]; then ZIP=$(ls *.zip 2>/dev/null | head -n 1); fi
          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then echo "ERROR: no zip file in repo root"; exit 1; fi
          echo "Unzipping $ZIP"
          unzip -o "$ZIP"

      - name: Build debug APK
        working-directory: ekts-android
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ekts-debug-apk
          path: ekts-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
